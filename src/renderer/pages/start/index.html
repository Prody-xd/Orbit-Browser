<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Orbit</title>
    <!-- Los colores vienen del tema activo, generados por el proceso principal. -->
    <link rel="stylesheet" href="orbit://theme/theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Orbit</h1>
        <p id="clock"></p>
      </header>

      <form id="search" action="https://duckduckgo.com/" method="get">
        <input id="q" name="q" type="text" placeholder="Buscar en la web" autocomplete="off" spellcheck="false" autofocus />
      </form>

      <section class="links" id="links"></section>

      <section class="tips">
        <h2>Atajos</h2>
        <ul>
          <li><kbd>Ctrl</kbd>+<kbd>T</kbd> pestaña nueva</li>
          <li><kbd>Ctrl</kbd>+<kbd>W</kbd> cerrar pestaña</li>
          <li><kbd>Ctrl</kbd>+<kbd>L</kbd> ir a la barra de direcciones</li>
          <li><kbd>Ctrl</kbd>+<kbd>F</kbd> buscar en la página</li>
          <li><kbd>Ctrl</kbd>+<kbd>,</kbd> abrir o cerrar ajustes</li>
          <li><kbd>Ctrl</kbd>+<kbd>1…9</kbd> ir a una pestaña</li>
          <li><kbd>F6</kbd> dormir las demás pestañas</li>
        </ul>
      </section>
    </main>

    <script src="start.js"></script>
  </body>
</html>
